# M2 acceptance: does the LLM-simulated human follow its persona? (IMPLEMENTATION_PLAN M2)
# Partner = Qwen3.8-27B playing the persona (same served model as the ego will use, different prompt).
# Ego = scripted neutral cook, so only the partner calls the model. Read off `compliance` per persona
# in `analyze`; any persona below 0.70 gets its wording revised before Gate 0 is rerun with the LLM human.
name: m2_compliance
seed: 0
env: {max_steps: 300}
backends: {ego: qwen3.8-27b, partner: qwen3.8-27b-partner}
# F1 runs on the layouts that passed Gate 0 (one open order); F2 failed Gate 0 and stays only as a
# reference for the LLM human's competence on two pots.
cells:
  - {layout: shared_1pot, personas: [onion_supplier, tomato_supplier]}
  - {layout: split_1pot, personas: [onion_supplier, tomato_supplier]}
  - {layout: shared_2pot, personas: [loader, server]}
conditions:
  - {name: neutral_ego, ego: neutral}
  # The neutral ego always has a plate out, so the persona's "plate it when a soup is ready" clause
  # never comes up; this ego fills pots but never fetches a plate, so the partner has to.
  - {name: no_plating_ego, ego: no_plating}
episodes_per_cell: 10
